name: Validate accounting-only demonstration
on:
  push:
    branches: [feat/accounting-only-demo]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/accounting-only-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Finalize canonical accounting fees
        run: |
          if [ -f .accounting-validation/fees-applied ]; then exit 0; fi
          python .accounting-validation/fees.py
          touch .accounting-validation/fees-applied
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep accounting form fees and indicators consistent'
          git push origin HEAD:feat/accounting-only-demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:pages
      - name: Preserve exact source
        if: always()
        run: |
          mkdir -p validation
          git archive --format=zip HEAD -o validation/source.zip
          git rev-parse HEAD > validation/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounting-final-source
          path: validation/
          retention-days: 7
