name: Import approved demonstration snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-demo.yml]

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'tiagodevss/teste-crm'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import only the approved demo source
        env:
          SOURCE_ARCHIVE: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e340-820e-8974-31a1df55261e/raw?se=2026-11-10T17%3A16%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=74384ef2-bd1f-57a9-abff-cd02a175b497&skoid=9fcafdab-1a9a-48a1-833e-6f0dce81fc66&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T12%3A36%3A18Z&ske=2026-11-11T12%3A36%3A18Z&sks=b&skv=2026-02-06&sig=eoWOtZHo8ytsnlzSwRQgioYtOtWZRzCtkxQslL/zxAM%3D'
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          root = pathlib.Path.cwd()
          if (root / 'package.json').exists():
              raise SystemExit('Refusing to overwrite an initialized application')
          data = urllib.request.urlopen(os.environ['SOURCE_ARCHIVE'], timeout=60).read()
          assert hashlib.sha256(data).hexdigest() == '3c6e0867d00f1a9745ad610f625f028c993c0f9dd6bc86c18c805279b0100b54', 'Archive integrity mismatch'
          outer = zipfile.ZipFile(io.BytesIO(data))
          assert outer.read('validation/commit.txt').decode().strip() == '85ea32bb0ed371d984d428c418fc80f8980cab46'
          source = zipfile.ZipFile(io.BytesIO(outer.read('validation/source.zip')))
          count = 0
          for item in source.infolist():
              path = pathlib.PurePosixPath(item.filename)
              if item.is_dir():
                  continue
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Unsafe archive path')
              if path.parts[0] in {'.git', '.github'}:
                  continue
              if any(part.startswith('.env') for part in path.parts):
                  raise SystemExit('Environment file not allowed')
              if (item.external_attr >> 16) & 0o170000 == 0o120000:
                  raise SystemExit('Symlinks not allowed')
              dest = root / str(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(source.read(item))
              count += 1
          assert count == 230, f'Unexpected source count: {count}'
          for name in ['README.md', 'docs/demo/README.md', 'tests/demo/pages-paths.test.mjs']:
              path = root / name
              path.write_text(path.read_text().replace('https://codi-solutionss.github.io/teste-crm/', 'https://tiagodevss.github.io/teste-crm/').replace("https://codi-solutionss.github.io'", "https://tiagodevss.github.io'"))
          path = root / 'README.md'
          text = path.read_text()
          text = text.replace('Para repositórios privados de organizações, a disponibilidade do Pages depende do plano contratado.', 'Este repositório pessoal é público e pode usar o GitHub Pages no plano gratuito. A ativação inicial continua necessária.')
          text = text.replace('Sites Pages podem ser públicos mesmo quando o repositório de código é privado.', 'O código deste repositório e o site Pages são públicos.')
          path.write_text(text)
          path = root / 'docs/PROVENANCE.md'
          path.write_text(path.read_text() + '\n## Repositório pessoal\n\nDestino: `tiagodevss/teste-crm`. Snapshot importado de `codi-solutionss/teste-crm` no commit `85ea32bb0ed371d984d428c418fc80f8980cab46`, sem o histórico Git privado. A migração altera apenas os endereços de hospedagem e a documentação; a aplicação e seus contratos são preservados. Os repositórios de origem não são modificados.\n')
          print(f'Imported {count} approved source files without private Git history')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: migrate reviewed demo to personal repository without private history'
          git push origin HEAD:main
