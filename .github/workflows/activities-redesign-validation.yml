name: Validate activities redesign
on:
  push:
    branches: [feat/activities-redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activities-redesign-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEMO_BASE_PATH: /teste-crm/
    steps:
      - uses: actions/checkout@v4

      - name: Materialize redesigned activities source
        run: |
          cat .activities-redesign/patch.part.* | base64 -d | gunzip > /tmp/activities-redesign.patch
          patch -p1 < /tmp/activities-redesign.patch
          rm -rf .activities-redesign
          rm -f .github/workflows/activities-redesign-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: redesign activities workspace'
          git push origin HEAD:feat/activities-redesign

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:pages

      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium

      - name: Validate presentation journey
        run: npm run test:demo:browser

      - name: Validate audited flows and responsive activities
        run: npm run test:demo:audit

      - name: Validate Pages paths
        run: npm run test:pages

      - name: Validate shared UI regressions
        run: |
          node tests/browser/build.mjs
          python tests/browser/test_feedback.py

      - name: Preserve validation evidence
        if: always()
        run: |
          mkdir -p validation
          git archive --format=zip HEAD -o validation/source.zip
          git rev-parse HEAD > validation/commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activities-redesign-validation
          path: |
            validation/
            audit-results/
            demo-test-results/
            node_modules/.cache/feedback-browser/*.png
          retention-days: 7
